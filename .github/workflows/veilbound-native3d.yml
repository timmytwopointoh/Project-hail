name: VEILBOUND - Native 3D Android RPG
on:
  push:
    branches:
      - 'feature/veilbound-*'
      - main
    paths:
      # Only game/runtime and emulator analysis changes need a costly full APK run.
      # Manager task plans and docs are covered by fast parallel QA instead.
      - 'veilbound/app/**'
      - 'veilbound/tests/**'
      - 'veilbound/build.gradle'
      - 'veilbound/settings.gradle'
      - 'veilbound/scripts/emulator_test.py'
      - 'veilbound/scripts/emulator_test.sh'
      - 'veilbound/scripts/qa_analyze.py'
      - 'veilbound/scripts/qa_coordinator.py'
      - '.github/workflows/veilbound-native3d.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Isolate the player-test branch from older long-running emulator releases.
  group: veilbound-m11-hero-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and test pure RPG rules
        run: |
          mkdir -p /tmp/veilbound-unit
          javac -d /tmp/veilbound-unit \
            veilbound/app/src/main/java/game/ashenveil/veilbound/WorldState.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/CombatMotion.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/CharacterRig.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/HeroPose.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/ShapeEngine.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/BellwardenAnatomy.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/HumanAnatomy.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/HumanSkeleton.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/ContinuousHuman.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/MaterialMapping.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/BootAssets.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/EnvironmentKit.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/ModelStudio.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/ArtKit.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/DetailArtKit.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/CinematicArtKit.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/SurfaceAtlas.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/ObjMeshLoader.java \
            veilbound/app/src/main/java/game/ashenveil/veilbound/MaterialTextures.java \
            veilbound/tests/game/ashenveil/veilbound/WorldRulesTest.java \
            veilbound/tests/game/ashenveil/veilbound/CombatMotionTest.java \
            veilbound/tests/game/ashenveil/veilbound/CharacterRigTest.java \
            veilbound/tests/game/ashenveil/veilbound/HeroPoseTest.java \
            veilbound/tests/game/ashenveil/veilbound/ShapeEngineTest.java \
            veilbound/tests/game/ashenveil/veilbound/BellwardenAnatomyTest.java \
            veilbound/tests/game/ashenveil/veilbound/ForgedPlateTest.java \
            veilbound/tests/game/ashenveil/veilbound/ArticulatedJointTest.java \
            veilbound/tests/game/ashenveil/veilbound/HumanAnatomyTest.java \
            veilbound/tests/game/ashenveil/veilbound/HumanSkeletonTest.java \
            veilbound/tests/game/ashenveil/veilbound/ContinuousHumanTest.java \
            veilbound/tests/game/ashenveil/veilbound/MaterialMappingTest.java \
            veilbound/tests/game/ashenveil/veilbound/BootAssetsTest.java \
            veilbound/tests/game/ashenveil/veilbound/CombatGameplayTest.java \
            veilbound/tests/game/ashenveil/veilbound/EnvironmentKitTest.java \
            veilbound/tests/game/ashenveil/veilbound/ModelStudioTest.java \
            veilbound/tests/game/ashenveil/veilbound/ArtKitTest.java \
            veilbound/tests/game/ashenveil/veilbound/DetailArtKitTest.java \
            veilbound/tests/game/ashenveil/veilbound/CinematicArtKitTest.java \
            veilbound/tests/game/ashenveil/veilbound/SurfaceAtlasTest.java \
            veilbound/tests/game/ashenveil/veilbound/ObjMeshLoaderTest.java \
            veilbound/tests/game/ashenveil/veilbound/MaterialTexturesTest.java
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ModelStudioTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.WorldRulesTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.CombatMotionTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.CharacterRigTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.HeroPoseTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ShapeEngineTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.BellwardenAnatomyTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ForgedPlateTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ArticulatedJointTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.HumanAnatomyTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.HumanSkeletonTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ContinuousHumanTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.MaterialMappingTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.BootAssetsTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.CombatGameplayTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.EnvironmentKitTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ArtKitTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.DetailArtKitTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.CinematicArtKitTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.SurfaceAtlasTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.ObjMeshLoaderTest
          java -cp /tmp/veilbound-unit game.ashenveil.veilbound.MaterialTexturesTest
      - name: Build true native-3D Android APK
        run: gradle -p veilbound :app:assembleDebug --no-daemon
      - name: Validate game build and scripts
        run: |
          python3 -m py_compile veilbound/scripts/emulator_test.py veilbound/scripts/qa_analyze.py veilbound/scripts/qa_coordinator.py veilbound/scripts/ai_worker.py
          bash -n veilbound/scripts/emulator_test.sh
          unzip -l veilbound/app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes[.]dex'
      - name: Install image quality analyzer
        run: python3 -m pip install --quiet --user Pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Native OpenGL render, install and controls on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash veilbound/scripts/emulator_test.sh
      - name: Analyze screenshots, renderer logs and resource budget
        if: always()
        run: python3 veilbound/scripts/qa_analyze.py --output inspection_output/veilbound
      - name: Prioritize machine-detectable failures into repair tasks
        if: always()
        run: |
          python3 veilbound/scripts/qa_coordinator.py --input inspection_output/veilbound --commit "${{ github.sha }}"
          cat inspection_output/veilbound/task_plan.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload screenshots, logs and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-native3d-inspection-report
          path: inspection_output/veilbound/
          if-no-files-found: warn
      - name: Upload candidate APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-native3d-candidate-UNVERIFIED
          path: veilbound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Upload emulator-verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-native3d-android15-TESTED-apk
          path: veilbound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

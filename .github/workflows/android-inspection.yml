name: APK Vision Inspector
on:
  push:
    branches: [main]
    paths:
      - 'inspector/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/android-inspection.yml'
  workflow_dispatch:
    inputs:
      apk_path:
        description: Repository-relative APK path; blank runs emulator smoke test
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: apk-vision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate emulator Bash script
        run: bash -n scripts/emulator_smoke.sh
      - name: Test visual comparison engine
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet Pillow
          .venv/bin/python -m unittest discover -s tests -v
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Create report directory
        run: mkdir -p inspection_output
      - name: Emulator smoke test and optional APK installation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ inputs.apk_path }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator_smoke.sh
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p inspection_output
          timeout 15s adb devices -l > inspection_output/adb_failure.txt 2>&1 || true
          timeout 15s adb logcat -d -t 300 > inspection_output/logcat_failure.txt 2>&1 || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-vision-report
          path: inspection_output/
          if-no-files-found: warn
          retention-days: 7

name: Matrix Flap - Real APK Emulator Test
on:
  push:
    branches:
      - main
      - 'feature/matrix-flap-*'
    paths:
      - 'matrix-flap/**'
      - '.github/workflows/matrix-flap-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrix-flap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build original Matrix Flap APK
        run: gradle -p matrix-flap :app:assembleDebug --no-daemon
      - name: Verify compiled launcher icon
        run: |
          unzip -l matrix-flap/app/build/outputs/apk/debug/app-debug.apk | grep -E 'res/drawable-nodpi.*/ic_cinematic[.]webp'
          SDK_TOOLS=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$SDK_TOOLS/aapt" dump badging matrix-flap/app/build/outputs/apk/debug/app-debug.apk | grep 'icon='
      - name: Validate test scripts
        run: |
          bash -n matrix-flap/scripts/emulator_test.sh
          python3 -m py_compile matrix-flap/scripts/test_matrix_flap.py
          python3 - <<'PY'
          from pathlib import Path
          html=Path("matrix-flap/app/src/main/assets/index.html").read_text()
          js=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/matrix-flap-script.js").write_text(js)
          PY
          node --check /tmp/matrix-flap-script.js
      - name: Install image comparison dependency
        run: python3 -m pip install --quiet --user Pillow
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Android 15 install and gameplay test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash matrix-flap/scripts/emulator_test.sh
      - name: Evaluate Matrix Flap quality gate
        if: always()
        run: python3 matrix-flap/scripts/quality_gate.py --output inspection_output/matrix_flap
      - name: Upload gameplay screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-flap-gameplay-report
          path: inspection_output/matrix_flap/
          if-no-files-found: warn
      - name: Upload compiled candidate APK (not emulator verified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-flap-cinematic-v12-side-by-side-candidate-UNVERIFIED
          path: matrix-flap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Upload tested Matrix Flap APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-flap-cinematic-v12-tested-apk
          path: matrix-flap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

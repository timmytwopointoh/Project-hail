name: VQ Library - Durable Source Snapshot

on:
  push:
    branches: ['feature/vq-library-snapshot-*', 'feature/vq-m34-runtime-benchmarks-*']
    paths:
      - 'veilforge/library_archive.py'
      - 'veilforge/vq_ci_benchmarks.py'
      - 'veilforge/vq_ci_artifact_probe.py'
      - 'veilforge/evidence/m34-09-*.json'
      - 'veilforge/VQ_M34_EFFICIENCY_MAP.json'
      - '.github/workflows/vq-m34-benchmark-evidence.yml'
      - 'veilforge/tests/test_library_archive.py'
      - 'docs/vq-library/**'
      - '.github/workflows/vq-library-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vq-library-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-snapshot:
    name: Verify and archive full tracked project source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject source corruption and malformed backup recipes
        run: |
          set -euo pipefail
          python3 -m unittest discover -s veilforge/tests -p 'test_library_archive.py' -v
          python3 -m compileall -q veilforge/library_archive.py
      - name: Build and verify immutable source ZIP
        id: archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vq-library"
          PACKAGE="$RUNNER_TEMP/vq-library/vq-veilforge-source-${GITHUB_SHA}.zip"
          python3 veilforge/library_archive.py build --root "$GITHUB_WORKSPACE" --output "$PACKAGE" --commit "$GITHUB_SHA"
          python3 veilforge/library_archive.py verify --archive "$PACKAGE" --commit "$GITHUB_SHA"
          test -s "$PACKAGE"
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Source ZIP SHA256: $(sha256sum "$PACKAGE" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo 'The archive includes tracked source and exact file hashes, not Git history or installed SDKs.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep complete source ZIP for personal Library backup
        uses: actions/upload-artifact@v4
        with:
          name: VQ-VEILFORGE-FULL-SOURCE-${{ github.sha }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

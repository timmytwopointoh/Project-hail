name: VQ - Universal 3D Model Tools

on:
  push:
    branches: ['brand/veylquorin-20261016', 'feature/vq-*']
    paths:
      - 'veilforge/vq_model_tools.py'
      - 'veilforge/vq_brushes.py'
      - 'veilforge/vq_adaptive_remesh.py'
      - 'veilforge/vq_multimaterial_export.py'
      - 'veilforge/tests/test_vq_multimaterial_export.py'
      - 'veilforge/vq_adaptive_remesh_demo.json'
      - 'veilforge/vq_refinement_pipeline.py'
      - 'veilforge/vq_sculpt_detail_patch.py'
      - 'veilforge/vq_mesh_baker.py'
      - 'veilforge/vq_engine_health.py'
      - 'veilforge/tests/test_vq_mesh_baker.py'
      - 'veilforge/tests/test_vq_engine_health.py'
      - 'veilforge/VQ_M30_BAKING_AND_CLEANUP.md'
      - 'veilforge/vq_quality_plan.py'
      - 'veilforge/VQ_ENGINE_QUALITY_PLAN.json'
      - 'veilforge/VQ_M29_ENGINE_BLUEPRINT.md'
      - 'veilforge/tests/test_vq_adaptive_remesh.py'
      - 'veilforge/tests/test_vq_quality_plan.py'
      - 'veilforge/vq_brush_demo.json'
      - 'veilforge/tests/test_vq_brushes.py'
      - 'veilforge/VQ_BRUSH_TOOLS.md'
      - 'veilforge/tests/test_vq_model_tools.py'
      - 'veilforge/queue.py'
      - 'veilforge/provenance.py'
      - 'veilforge/steward.py'
      - '.github/workflows/veilforge-unified-queue.yml'
      - 'veilforge/VQ_MODEL_TOOLS.md'
      - '.github/workflows/vq-model-tools.yml'
  workflow_dispatch:
    inputs:
      catalog_model:
        description: 'One real asset to build and inspect (model chat can use CLI for any triangulated OBJ)'
        required: true
        type: choice
        default: 'ancient_tree'
        options:
          - 'ancient_tree'
          - 'ceremonial_sword'
          - 'cargo_cart'
          - 'treasure_chest'
          - 'ancient_gate_standard'
          - 'ancient_gate_mobile'
          - 'forest_tree_mobile'
          - 'rolling_terrain'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: vq-universal-model-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-technical-inspection:
    name: VQ real OBJ / glTF / UV inspection and fourteen visual angles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real source-mesh software preview renderer
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Exercise existing engine and new quality/inspection regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s veilforge/tests -v
          python3 -m compileall -q veilforge
      - name: Freeze and fingerprint the claimed owner's exact GitHub source revision
        run: |
          set -euo pipefail
          mkdir -p inspection_output/vq-smoke/provenance
          python3 veilforge/provenance.py snapshot --root . \
            --out inspection_output/vq-smoke/provenance/source_manifest.json
          python3 veilforge/provenance.py verify --root . \
            --snapshot inspection_output/vq-smoke/provenance/source_manifest.json
      - name: Produce an original source mesh with existing VEILFORGE compatibility engine
        env:
          VQ_CATALOG_MODEL: ${{ inputs.catalog_model || 'ancient_tree' }}
        run: |
          set -euo pipefail
          mkdir -p inspection_output/vq-smoke/source
          python3 veilforge/factory.py \
            --catalog veilforge/catalog.json --id "$VQ_CATALOG_MODEL" \
            --out inspection_output/vq-smoke/source
          echo "MODEL_ID=$VQ_CATALOG_MODEL" >> "$GITHUB_ENV"
      - name: Run VQ universal model-inspection tool on actual OBJ and glTF
        run: |
          set -euo pipefail
          python3 veilforge/vq_model_tools.py \
            --obj "inspection_output/vq-smoke/source/$MODEL_ID.obj" \
            --gltf "inspection_output/vq-smoke/source/$MODEL_ID.gltf" \
            --out inspection_output/vq-smoke/inspection
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("inspection_output/vq-smoke/inspection")
          r=json.loads((root/"vq_model_report.json").read_text())
          assert r["engine"]=="VEYLQUORIN" and r["short_name"]=="VQ"
          assert r["technical_geometry_smoke_passed"] is True
          assert r["gltf"]["structural_smoke_passed"] is True
          assert len(r["visual"]["views"])==14
          assert r["production_approved"] is False
          assert r["reference_likeness_verified"] is False
          assert (root/"views/contact_sheet.png").stat().st_size>1000
          print("VQ_MODEL_TECHNICAL_SMOKE_PASS",r["source_obj"],"angles",len(r["visual"]["views"]))
          PY
          cat inspection_output/vq-smoke/inspection/vq_model_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise real VQ sculpt, smoothing and detail-stamp tools on actual terrain mesh
        run: |
          set -euo pipefail
          python3 veilforge/factory.py \
            --catalog veilforge/catalog.json \
            --id rolling_terrain \
            --out inspection_output/vq-smoke/brush-source
          python3 veilforge/vq_brushes.py \
            --obj inspection_output/vq-smoke/brush-source/rolling_terrain.obj \
            --recipe veilforge/vq_brush_demo.json \
            --out inspection_output/vq-smoke/brushes/terrain_refined.obj
          python3 veilforge/vq_model_tools.py \
            --obj inspection_output/vq-smoke/brushes/terrain_refined.obj \
            --out inspection_output/vq-smoke/brushes/inspected \
            --render-faces 4000
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("inspection_output/vq-smoke/brushes")
          r=json.loads((root/"terrain_refined_brush_review.json").read_text())
          v=json.loads((root/"inspected/vq_model_report.json").read_text())
          assert r["engine"]=="VEYLQUORIN"
          assert len(r["strokes"])==3
          assert [x["op"] for x in r["strokes"]]==["sculpt","smooth","stamp"]
          assert all(x["mesh_faces_inserted"]==0 for x in r["strokes"])
          assert r["integrity_metrics_before"]==r["integrity_metrics_after"]
          assert sum(x["groups_moved"] for x in r["strokes"])>0
          assert v["technical_geometry_smoke_passed"] is True
          assert len(v["visual"]["views"])==14
          assert r["android_emulator_verified"] is False
          assert r["ready_for_game"] is False
          print("VQ_ADAPTIVE_BRUSH_PASS",
                "source_faces",r["source_triangles"],
                "strokes",len(r["strokes"]),
                "orbit_views",len(v["visual"]["views"]))
          PY
      - name: Validate all VQ quality milestones without false completion claims
        run: |
          set -euo pipefail
          python3 veilforge/vq_quality_plan.py \
            --out inspection_output/vq-smoke/quality-plan/roadmap_report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inspection_output/vq-smoke/quality-plan/roadmap_report.json").read_text())
          assert r["milestones"]>=30 and not r["all_milestones_verified"]
          assert r["game_auto_promotion_allowed"] is False
          print("VQ_MASTER_ROADMAP_VALIDATED",r["milestones"],"milestones")
          PY
      - name: Run non-destructive sculpt and conforming adaptive refinement on real terrain
        run: |
          set -euo pipefail
          python3 veilforge/vq_refinement_pipeline.py \
            --obj inspection_output/vq-smoke/brush-source/rolling_terrain.obj \
            --brush veilforge/vq_brush_demo.json \
            --refine veilforge/vq_adaptive_remesh_demo.json \
            --source-gltf inspection_output/vq-smoke/brush-source/rolling_terrain.gltf \
            --source-manifest inspection_output/vq-smoke/brush-source/asset_manifest.json \
            --out inspection_output/vq-smoke/adaptive
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("inspection_output/vq-smoke/adaptive")
          result=json.loads((root/"refinement_evidence.json").read_text())
          remesh=json.loads((root/"stage2_refined_remesh_report.json").read_text())
          inspected=json.loads((root/"inspector/vq_model_report.json").read_text())
          assert result["source_triangles"]==result["brushed_triangles"]
          assert result["remeshed_triangles"]>result["source_triangles"]
          assert result["adaptive_interior_edges"]>100
          assert remesh["topology_before"]==remesh["topology_after"]
          assert result["checked_angles"]==14
          assert inspected["uv"]["collapsed_uv_faces"]==0
          assert inspected["technical_geometry_smoke_passed"] is True
          assert result["multi_material_export_verified"] is True
          assert result["preserved_texture_images_verified"]>=8
          real=json.loads((root/"stage2_material_preserved.gltf").read_text())
          assert len(real["materials"])>=2
          assert len(real["images"])>=8
          assert len(real["meshes"][0]["primitives"])==len(real["materials"])
          assert all((root/img["uri"]).is_file() for img in real["images"])
          assert not result["artist_approval"] and not result["game_ready"]
          print("VQ_M29_ENGINE_GATE_PASS",
                result["source_triangles"],"->",result["remeshed_triangles"],
                "interior_edges",result["adaptive_interior_edges"],"views",result["checked_angles"])
          PY
          cat inspection_output/vq-smoke/adaptive/refinement_evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Produce genuine high-detail sculpt meshes and bake actual geometry into maps
        run: |
          set -euo pipefail
          python3 veilforge/vq_sculpt_detail_patch.py --out inspection_output/vq-smoke/m30/geometry
          python3 veilforge/vq_mesh_baker.py \
            --low inspection_output/vq-smoke/m30/geometry/source_low.obj \
            --high inspection_output/vq-smoke/m30/geometry/source_high.obj \
            --out inspection_output/vq-smoke/m30/baked --size 128
          python3 veilforge/vq_model_tools.py \
            --obj inspection_output/vq-smoke/m30/geometry/source_high.obj \
            --out inspection_output/vq-smoke/m30/high-detail-inspection \
            --render-faces 4000
          python3 veilforge/vq_engine_health.py --root . \
            --out inspection_output/vq-smoke/m30/engine_health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("inspection_output/vq-smoke/m30")
          bake=json.loads((root/"baked/bake_manifest.json").read_text())
          inspection=json.loads((root/"high-detail-inspection/vq_model_report.json").read_text())
          health=json.loads((root/"engine_health.json").read_text())["status"]
          assert bake["texels_sampled"] > 10000
          assert bake["meaningful_normal_variation_texels"] > 1200
          assert bake["max_high_poly_normal_angle_deg"] > 3
          assert inspection["technical_geometry_smoke_passed"] is True
          assert len(inspection["visual"]["views"]) == 14
          assert health["technical_cleanup_gate_passed"]
          assert bake["artistic_signoff"] is False and bake["android_emulator_verified"] is False
          print("VQ_M30_TRUE_HIGH_TO_LOW_BAKE_PASS",bake["texels_sampled"],
                "texels",bake["meaningful_normal_variation_texels"],
                "nonflat; health",health["modules_checked"])
          PY
      - name: Sign immutable VQ model inspection report under GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: inspection_output/vq-smoke/inspection/vq_model_report.json
      - name: Sign source-provenance manifest for this exact model experiment
        uses: actions/attest@v4
        with:
          subject-path: inspection_output/vq-smoke/provenance/source_manifest.json
      - name: Archive source models, fourteen views, masks and all technical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vq-3d-model-tools-results-${{ github.sha }}
          path: inspection_output/vq-smoke/
          if-no-files-found: warn
          retention-days: 30

name: VEILBOUND - Parallel Android Emulator Farm
on:
  # Once integrated into the M14 game branch, automatically test each new
  # meaningful game version using one APK and 4 concurrent Android 15 VMs.
  # This isolated feature branch is included temporarily for its real pilot.
  push:
    branches:
      - 'feature/veilbound-m14-full-character-sculpt'
      - 'feature/veilbound-m15-fitted-armor-realism'
      - 'feature/veilbound-m15b-layered-pauldron-sculpt'
      - 'feature/veilbound-m16-articulated-joints'
      - 'feature/veilbound-m17-human-anatomy-worker-loop'
      - 'feature/veilbound-m18-skinned-human-rig'
      - 'feature/veilbound-m19-reference-realism-loop'
      - 'feature/veilbound-m20-50-worker-anatomy-forge'
      - 'feature/veilbound-m21-five-digit-hands'
      - 'feature/veilbound-m23-extreme-refinement'
      - 'feature/veilbound-m24-veilforge-full-body'
      - 'feature/veilbound-m25-facial-surface-material-alignment'
      - 'feature/veilbound-m28-integrated-facial-sculpt'
      - 'feature/veilbound-m29-reference-skin-tpose'
      - 'feature/veilbound-m32-anatomy-perfection'
      - 'feature/veilbound-m31-reference-driven-realism'
      - 'feature/veilforge-m26-sculpt-learning-curriculum'
      - 'feature/veilbound-m14-synchronized-emulator-workers'
    paths:
      - '.github/workflows/veilbound-parallel-emulators.yml'
      - 'veilbound/app/**'
      - 'veilbound/scripts/emulator_farm.py'
      - 'veilbound/scripts/emulator_test.py'
      - 'veilbound/scripts/qa_analyze.py'
      - 'veilbound/scripts/emulator_test.sh'
      - 'veilbound/scripts/emulator_shard_test.sh'
  workflow_dispatch:
    inputs:
      emulator_instances:
        description: 'Same-build parallel Android emulator VMs'
        type: choice
        required: true
        default: '4'
        options: ['1', '2', '4', '8']
      emulator_mode:
        description: 'Same Android version for development, or opt-in legacy compatibility'
        type: choice
        required: true
        default: 'synchronized'
        options: ['synchronized', 'compatibility']
permissions:
  contents: read
# One immutable APK. Each emulator runs on a separate GitHub Ubuntu runner,
# not competing for KVM, ADB ports, logcat or filesystem resources on one VM.
# All synchronized machines run Android 15 with one immutable game binary.
# The 4-shard default tests workers' latest game commit, NOT OS compatibility.
# Optional compatibility mode retains Android 13/14/15 checks for release QA.
# Runners may queue on GitHub account limits; no extra API or secret is required.
concurrency:
  # Supersede outdated candidate farms: all emulators run the latest SAME
  # branch commit and never burn hosted VM time on superseded game versions.
  group: veilbound-emulator-farm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-director:
    name: Plan isolated emulator instances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Allocate same-Android-version worker game-test instances
        id: plan
        run: |
          python3 veilbound/scripts/emulator_farm.py \
            --count "${{ inputs.emulator_instances || '4' }}" \
            --mode "${{ inputs.emulator_mode || 'synchronized' }}" \
            --github-output "${GITHUB_OUTPUT}" \
            --out inspection_output/farm-plan
          cat inspection_output/farm-plan/emulator_farm_report.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Store immutable emulator assignment
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-emulator-plan
          path: inspection_output/farm-plan/
          retention-days: 14
  build-shared-apk:
    name: Build and validate one common native APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      apk_sha256: ${{ steps.apk-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android debug APK once
        run: gradle -p veilbound :app:assembleDebug --no-daemon
      - name: Verify APK contains classes
        run: |
          test -s veilbound/app/build/outputs/apk/debug/app-debug.apk
          unzip -l veilbound/app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes[.]dex'
      - name: Record immutable common APK SHA256
        id: apk-digest
        run: |
          echo "sha256=$(sha256sum veilbound/app/build/outputs/apk/debug/app-debug.apk | cut -d ' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Share this exact APK with all emulator instances
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-emulator-shared-debug-apk
          path: veilbound/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  emulator-instances:
    name: Android ${{ matrix.api }} / ${{ matrix.profile }} / ${{ matrix.id }}
    needs: [emulator-director, build-shared-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.emulator-director.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download common APK into expected game build location
        uses: actions/download-artifact@v4
        with:
          name: veilbound-emulator-shared-debug-apk
          path: veilbound/app/build/outputs/apk/debug/
      - name: Prove downloaded APK is byte-identical to common build
        run: |
          echo "${{ needs.build-shared-apk.outputs.apk_sha256 }}  veilbound/app/build/outputs/apk/debug/app-debug.apk" | sha256sum -c -
      - name: Install screenshot image analysis dependencies
        run: python3 -m pip install --quiet --user Pillow
      - name: Enable KVM for this runner only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Launch independent Android emulator and exercise actual game
        env:
          VEILBOUND_EXPECTED_API: ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash veilbound/scripts/emulator_shard_test.sh
      - name: Preserve actual APK fingerprint per emulator (also after failure)
        if: always()
        run: |
          mkdir -p inspection_output/veilbound
          sha256sum veilbound/app/build/outputs/apk/debug/app-debug.apk | cut -d ' ' -f1 > inspection_output/veilbound/apk_sha256.txt
      - name: Analyze each emulator's real screenshots and GLES diagnostics
        if: always()
        run: python3 veilbound/scripts/qa_analyze.py --output inspection_output/veilbound
      - name: Generate per-emulator repair queue
        if: always()
        run: |
          python3 veilbound/scripts/qa_coordinator.py \
            --input inspection_output/veilbound --commit "${{ github.sha }}"
          cat inspection_output/veilbound/task_plan.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Archive this specific emulator's logs, frames and QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-emulator-${{ matrix.id }}-inspection
          path: inspection_output/veilbound/
          if-no-files-found: warn
          retention-days: 14
  farm-aggregate:
    name: Verify all requested virtual Android devices
    needs: [emulator-director, build-shared-apk, emulator-instances]
    if: always() && needs.emulator-director.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect separate screenshot and QA reports
        uses: actions/download-artifact@v4
        with:
          pattern: veilbound-emulator-*-inspection
          path: inspection_output/farm-results/
        continue-on-error: true
      - name: Enforce evidence from every selected emulator
        run: |
          python3 veilbound/scripts/emulator_farm.py \
            --count "${{ needs.emulator-director.outputs.count }}" \
            --mode "${{ needs.emulator-director.outputs.mode }}" \
            --summarize inspection_output/farm-results \
            --expected-sha "${{ github.sha }}" \
            --expected-apk-sha "${{ needs.build-shared-apk.outputs.apk_sha256 }}" \
            --out inspection_output/farm-summary
          cat inspection_output/farm-summary/emulator_farm_report.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain aggregate proof and worker-ready repair assignments even if a device fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-parallel-emulator-farm-summary
          path: inspection_output/farm-summary/
          if-no-files-found: warn
          retention-days: 14

name: VQ Studio - Standalone Android APK
on:
  push:
    branches: ['app/vq-studio-companion-v1']
    paths:
      - 'vq-studio/**'
      - '.github/workflows/vq-studio-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vq-studio-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify screenshot evidence checkpoint/garbage collector
        run: |
          python3 -m unittest discover -s vq-studio/tests -v
          python3 -m compileall -q vq-studio
      - name: Compile VQ Studio standalone APK
        run: gradle -p vq-studio :app:assembleDebug --no-daemon --max-workers=2
      - name: Enable KVM on Ubuntu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-vq.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 app launch and black-space viewport smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r vq-studio/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.trioncompasitor.vqstudio/.MainActivity
            sleep 5
            adb shell pidof com.trioncompasitor.vqstudio
            mkdir -p inspection_output/vq-studio-android
            adb exec-out screencap -p > inspection_output/vq-studio-android/black_model_viewport.png
            test "$(wc -c < inspection_output/vq-studio-android/black_model_viewport.png)" -gt 7000
      - name: Package standalone APK as GitHub artifact
        if: success()
        run: |
          cp vq-studio/app/build/outputs/apk/debug/app-debug.apk VQ-Studio-v0.1-Android-Tested.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vq-studio-debug-apk-and-emulator-evidence
          path: |
            VQ-Studio-v0.1-Android-Tested.apk
            inspection_output/vq-studio-android/
          if-no-files-found: warn
          retention-days: 14

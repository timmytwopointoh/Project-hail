name: VEILBOUND - Independent Vision AI
on:
  workflow_run:
    workflows: ['VEILBOUND - Native 3D Android RPG']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Native-3D emulator workflow run ID containing screenshot artifact'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  visual-review:
    # Never give secrets to pull-request head code. Workflow checked out at the
    # trusted default branch and consumes only image/JSON files as inert data.
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image reader
        run: python -m pip install 'Pillow>=10,<13'
      - name: Download precisely the emulator screenshots from this run
        uses: actions/download-artifact@v4
        with:
          name: veilbound-native3d-inspection-report
          path: inspection_output/veilbound
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Independent visual critique of emulator output
        run: python3 veilbound/scripts/ai_worker.py --role visual --screenshots inspection_output/veilbound --out inspection_output/independent-vision
      - name: Preserve review beside test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-independent-vision-${{ github.run_attempt }}
          path: inspection_output/independent-vision/
          if-no-files-found: warn
          retention-days: 14

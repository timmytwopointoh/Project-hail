name: VEILBOUND - Parallel Worker QA
on:
  push:
    branches:
      - 'feature/veilbound-*'
    paths:
      - 'veilbound/**'
      - '.github/workflows/veilbound-parallel-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
# Deliberately no cancel-in-progress: each commit gets an immutable test report,
# even when artists/developers are already editing the next commit.
jobs:
  worker-qa:
    name: QA worker / ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role: [combat, assets, integrity]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute isolated QA worker
        run: python3 veilbound/scripts/qa_workers.py --role "${{ matrix.role }}" --out "inspection_output/worker-${{ matrix.role }}"
      - name: Test priority and repair queue classifier
        if: matrix.role == 'integrity'
        run: |
          python3 -m unittest discover -s veilbound/tests -p 'test_qa_coordinator.py' -v
          python3 -m unittest discover -s veilbound/tests -p 'test_worker_manager.py' -v
          python3 -m unittest discover -s veilbound/tests -p 'test_ai_worker_roles.py' -v
          python3 -m unittest discover -s veilbound/tests -p 'test_promote_proposal.py' -v
          python3 -m unittest discover -s veilbound/tests -p 'test_gemini_client.py' -v
          python3 -m unittest discover -s veilbound/tests -p 'test_team_manager.py' -v
      - name: Verify coding and promotion pipeline without an external AI
        if: matrix.role == 'integrity'
        run: |
          set -euo pipefail
          for role in combat animation models materials world studio; do
            python3 veilbound/scripts/worker_pipeline_selftest.py \
              --role "${role}" \
              --out "inspection_output/pipeline-selftest-${role}"
          done
      - name: Upload provider-free pipeline verification
        if: always() && matrix.role == 'integrity'
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-worker-endtoend-fixtures-${{ github.run_attempt }}
          path: inspection_output/pipeline-selftest-*/pipeline_verification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Keep independent QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilbound-worker-${{ matrix.role }}-${{ github.run_attempt }}
          path: inspection_output/worker-${{ matrix.role }}/*.json
          if-no-files-found: warn
          retention-days: 14

name: Project-hail artifact storage inventory — one-shot read-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-storage-inventory-20261017.yml']
permissions: {contents: read, actions: read}
jobs:
  artifact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const all=await github.paginate(github.rest.actions.listArtifactsForRepo,{owner,repo,per_page:100});
            const active=all.filter(a=>!a.expired);
            const groups=new Map();
            for(const a of active){
              const g=groups.get(a.name)||{count:0,bytes:0};
              g.count++;g.bytes+=a.size_in_bytes;groups.set(a.name,g);
            }
            const rows=[...groups.entries()].map(([name,x])=>({name,...x})).sort((a,b)=>b.bytes-a.bytes);
            const MiB=x=>(x/1048576).toFixed(2);
            const total=active.reduce((v,a)=>v+a.size_in_bytes,0);
            core.info('PROJECT_HAIL_STORAGE_SUMMARY artifacts='+active.length+' total_MiB='+MiB(total));
            for(const row of rows.slice(0,45))core.info('STORAGE_GROUP '+row.count+' '+MiB(row.bytes)+' MiB '+row.name);
            const table=rows.slice(0,40).map(x=>'| '+x.name.replace(/\|/g,'/')+' | '+x.count+' | '+MiB(x.bytes)+' |').join('\n');
            await core.summary.addHeading('Read-only Project-hail artifact inventory',2)
              .addRaw('Artifacts: **'+active.length+'**, reported size: **'+MiB(total)+' MiB**. Files are not deleted.\n\n')
              .addRaw('| Name | Count | MiB |\n|---|---:|---:|\n'+table).write();

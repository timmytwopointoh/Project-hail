name: VEILBOUND - Secure Gemini API Setup Test
on:
  workflow_dispatch:
permissions:
  contents: read
# Standalone trusted-default-branch workflow. It deliberately DOES NOT checkout
# a feature branch or run model-provided source with the repository secret.
# Exactly one short inference call per manual invocation. No code patches here.
jobs:
  gemini-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected Gemini API key with a harmless one-line prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.pop("GEMINI_API_KEY", "")
          model = os.environ.get("GEMINI_MODEL", "gemini-3.8-flash")
          if not key:
              print("ERROR: Missing GitHub Actions secret GEMINI_API_KEY.")
              print("Settings -> Secrets and variables -> Actions -> New repository secret")
              sys.exit(2)
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,95}", model):
              sys.exit("ERROR: Invalid GEMINI_MODEL repository variable.")
          payload = {
              "contents": [{"parts": [{"text": "Reply exactly VEILBOUND_GEMINI_READY"}]}],
              "generationConfig": {"maxOutputTokens": 64, "candidateCount": 1}
          }
          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/"
              + model + ":generateContent",
              data=json.dumps(payload).encode("utf-8"),
              headers={"x-goog-api-key": key, "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=45) as response:
                  result = json.loads(response.read(200000))
          except urllib.error.HTTPError as exc:
              print("Gemini API failed with HTTP", exc.code,
                    "(check key, model access, Google project quota and billing).")
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, ValueError):
              sys.exit("Gemini API connection or response failed.")
          response = " ".join(
              str(part.get("text", "")) for c in result.get("candidates", [])
              for part in c.get("content", {}).get("parts", []))
          if "VEILBOUND_GEMINI_READY" not in response:
              sys.exit("Gemini returned unexpected output; check model access.")
          usage = result.get("usageMetadata", {})
          print("SUCCESS: Gemini responds to the VEILBOUND GitHub secret.")
          print("Model:", str(result.get("modelVersion", model))[:100])
          print("Tokens reported:", usage.get("totalTokenCount", "unavailable"))
          print("No game source was transmitted, and the API key was not printed.")
          PY

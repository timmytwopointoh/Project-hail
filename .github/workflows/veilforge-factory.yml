name: VEILFORGE - Universal Game Asset Factory
on:
  push:
    branches: ['feature/veilforge-*']
    paths:
      - 'veilforge/**'
      - '.github/workflows/veilforge-factory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veilforge-universal-${{ github.ref }}
  cancel-in-progress: true

# Manager of managers, six specialized model families, dynamic recipe-derived
# worker assignment, four true geometry previews, binary glTF, deterministic QA.
# Never edits a game, merges generated code or promotes assets without review.
jobs:
  library-manager:
    name: Validate library and allocate scoped asset jobs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned image library before the full regression suite
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Unit and factory geometry tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s veilforge/tests -v
          python3 -m compileall -q veilforge
          python3 veilforge/vq_emulator_efficiency.py \
            --root . --out inspection_output/library-manager/emulator_efficiency_audit.json
          python3 veilforge/roadmap.py --out inspection_output/library-manager
      - id: plan
        name: Assign independently isolated asset workers from validated catalog
        run: |
          set -euo pipefail
          python3 veilforge/library_manager.py plan \
            --catalog veilforge/catalog.json \
            --out inspection_output/library-manager \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: veilforge-library-manager
          path: inspection_output/library-manager/
          if-no-files-found: error
          retention-days: 3

  asset-producers:
    name: Factory asset / ${{ matrix.id }}
    needs: library-manager
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.library-manager.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install visualization dependency
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Produce original geometry, physical-material declarations and inspectable views
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT="inspection_output/library/${ID}"
          python3 veilforge/factory.py --catalog veilforge/catalog.json --id "${ID}" --out "${OUT}"
          python3 veilforge/preview.py --catalog veilforge/catalog.json --id "${ID}" --out "${OUT}/previews"
          python3 veilforge/engine.py inspect \
            --obj "${OUT}/${ID}.obj" \
            --out "${OUT}/mesh_quality.json"
          python3 - "${OUT}" <<'PY'
          from pathlib import Path
          import json,sys
          folder=Path(sys.argv[1])
          row=json.loads((folder/"asset_manifest.json").read_text())
          assert row["triangles"]>100
          assert row["triangles"]<=row["budget"]
          assert row["mesh_quality"]["degenerate_triangles"]==0
          assert len(list((folder/"previews").glob("view_*.png")))==4
          assert (folder/(row["id"]+".gltf")).is_file()
          assert (folder/(row["id"]+".bin")).is_file()
          print("VEILFORGE_CATEGORY_WORKER_PASS",row["id"],row["category"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veilforge-library-${{ matrix.id }}
          path: inspection_output/library/${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 3

  library-review:
    name: Independently audit entire game-asset catalog
    needs: [library-manager, asset-producers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: veilforge-library-*
          path: inspection_output/library-collected
      - name: Require full evidence, no false promotion or invented previews
        run: |
          set -euo pipefail
          python3 veilforge/library_manager.py review \
            --catalog veilforge/catalog.json \
            --collected inspection_output/library-collected \
            --out inspection_output/library-review
          cat inspection_output/library-review/library_review.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Archive manager summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-library-final-review
          path: inspection_output/library-review/
          if-no-files-found: warn
          retention-days: 3

  scene-package:
    name: Assemble reusable world from reviewed asset outputs
    needs: [library-manager, asset-producers, library-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: veilforge-library-*
          path: inspection_output/library-collected
      - name: Build real multi-mesh, multi-instance glTF world package
        run: |
          set -euo pipefail
          python3 veilforge/assembly.py \
            --catalog veilforge/catalog.json \
            --scenes veilforge/scenes.json \
            --id ruin_courtyard_demo \
            --assets-root inspection_output/library-collected \
            --out inspection_output/scene-package
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("inspection_output/scene-package")
          manifest=json.loads((root/"scene_manifest.json").read_text())
          scene=json.loads((root/"ruin_courtyard_demo.gltf").read_text())
          assert manifest["instances"]==9
          assert manifest["unique_asset_sources"]==8
          assert len(scene["nodes"])==9
          assert len(scene["meshes"])==8
          assert all((root/b["uri"]).stat().st_size==b["byteLength"]
                     for b in scene["buffers"])
          assert manifest["production_approved"] is False
          print("VEILFORGE_SCENE_QA_PASS",manifest["instances"],
                "instances, assets",manifest["unique_asset_sources"])
          PY
      - name: Archive actual reusable scene pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-assembled-world-scene
          path: inspection_output/scene-package/
          if-no-files-found: warn
          retention-days: 3

  build-android-visual-probe:
    name: Build independent Android glTF renderer APK
    needs: [scene-package, library-review]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: veilforge-assembled-world-scene
          path: veilforge/android-probe/app/src/main/assets/scene/
      - name: Forge existing high-detail human and armored candidate for Android
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-java"
          javac -d "$RUNNER_TEMP/forge-java" \
            veilbound/app/src/main/java/game/ashenveil/veilbound/{ArtKit,DetailArtKit,CinematicArtKit,ShapeEngine,BellwardenAnatomy,HumanAnatomy,HumanSkeleton,ContinuousHuman,MaterialMapping,HeroPose,CombatMotion,CharacterRig,WorldState,ModelStudio,EnvironmentKit,SurfaceAtlas,MaterialTextures,ObjMeshLoader,BootAssets}.java \
            veilbound/tools/TeamEngineCLI.java veilforge/ForgeHumanCLI.java
          mkdir -p inspection_output/android-character-human inspection_output/android-character-armor
          java -Xmx1700m -Djava.awt.headless=true -cp "$RUNNER_TEMP/forge-java" \
            game.ashenveil.veilbound.ForgeHumanCLI inspection_output/android-character-human
          java -Xmx1500m -Djava.awt.headless=true -cp "$RUNNER_TEMP/forge-java" \
            game.ashenveil.veilbound.TeamEngineCLI models inspection_output/android-character-armor
          python3 veilforge/topology.py \
            --obj inspection_output/android-character-human/human_source.obj \
            --out inspection_output/android-character-human/human_repaired.obj --mode human
          python3 veilforge/gltf_export.py \
            --obj inspection_output/android-character-human/human_repaired.obj \
            --out inspection_output/android-character-human/human_repaired.gltf --profile skin
          python3 veilforge/topology.py \
            --obj inspection_output/android-character-armor/bellwarden_full_anatomy.obj \
            --out inspection_output/android-character-armor/bellwarden_full_anatomy_repaired.obj --mode assembly
          python3 veilforge/gltf_export.py \
            --obj inspection_output/android-character-armor/bellwarden_full_anatomy_repaired.obj \
            --out inspection_output/android-character-armor/bellwarden_full_anatomy_repaired.gltf --profile steel --double-sided
          python3 veilforge/probe_pack.py \
            --scene veilforge/android-probe/app/src/main/assets/scene \
            --human inspection_output/android-character-human/human_repaired.gltf \
            --armor inspection_output/android-character-armor/bellwarden_full_anatomy_repaired.gltf
      - name: Assert package uses actual worker-generated glTF buffers
        run: |
          set -euo pipefail
          test -s veilforge/android-probe/app/src/main/assets/scene/ruin_courtyard_demo.gltf
          test -s veilforge/android-probe/app/src/main/assets/scene/buffers/ancient_tree.bin
          test -s veilforge/android-probe/app/src/main/assets/scene/textures/ancient_tree/leaf/albedo.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("veilforge/android-probe/app/src/main/assets/scene")
          doc=json.loads((root/"ruin_courtyard_demo.gltf").read_text())
          assert len(doc.get("images",[]))>=20
          assert len(doc.get("textures",[]))==len(doc["images"])
          assert all((root/i["uri"]).is_file() for i in doc["images"])
          assert all(len((root/i["uri"]).read_bytes())>100 for i in doc["images"])
          assert all("baseColorTexture" in m["pbrMetallicRoughness"] for m in doc["materials"] if
                    m["name"].split("/")[0] not in ("human_repaired","bellwarden_full_anatomy_repaired"))
          assert len(doc["meshes"])==10
          assert len(doc["nodes"])==11
          assert all((root/b["uri"]).stat().st_size==b["byteLength"] for b in doc["buffers"])
          assert doc["extras"]["production_approved"] is False
          print("VEILFORGE_REAL_SCENE_EMBEDDED",len(doc["meshes"]),"meshes")
          PY
      - name: Build debug-only Android OpenGL test APK, not a game APK
        run: gradle -p veilforge/android-probe :app:assembleDebug --no-daemon
      - name: Verify byte identity and Android executable
        id: digest
        run: |
          set -euo pipefail
          APK=veilforge/android-probe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'classes[.]dex'
          echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: veilforge-android-shared-probe-apk
          path: veilforge/android-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  android-visual-workers:
    name: Android 15 / ${{ matrix.role }} / ${{ matrix.profile }}
    needs: [build-android-visual-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { role: scene-world, profile: pixel_6, api: 35 }
          - { role: nature-mobile, profile: pixel_7, api: 35 }
          - { role: props-equipment, profile: pixel_5, api: 35 }
          - { role: characters, profile: pixel_4, api: 35 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: veilforge-android-shared-probe-apk
          path: veilforge/android-probe/app/build/outputs/apk/debug/
      - name: Verify exact same compiled APK on all virtual devices
        run: |
          echo "${{ needs.build-android-visual-probe.outputs.sha256 }}  veilforge/android-probe/app/build/outputs/apk/debug/app-debug.apk" | sha256sum -c -
      - name: Install independent screenshot analysis
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Enable KVM for this isolated emulator runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Render 14 actual GLES views per model and reject blank/frozen frames
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ASSET_ROLE: ${{ matrix.role }}
          SOURCE_SHA: ${{ github.sha }}
          APK_SHA: ${{ needs.build-android-visual-probe.outputs.sha256 }}
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 veilforge/android_visual_qa.py --role "$ASSET_ROLE" --apk veilforge/android-probe/app/build/outputs/apk/debug/app-debug.apk --output "inspection_output/visual/$ASSET_ROLE" --apk-sha "$APK_SHA" --source-sha "$SOURCE_SHA"
      - name: Preserve all real screenshots, logcat, memory and defect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-android-${{ matrix.role }}
          path: inspection_output/visual/${{ matrix.role }}/
          if-no-files-found: warn
          retention-days: 7

  android-visual-review:
    name: Fail closed on incomplete emulator visual QA evidence
    needs: [build-android-visual-probe, android-visual-workers]
    if: always() && needs.build-android-visual-probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: veilforge-android-{scene-world,nature-mobile,props-equipment,characters}
          path: inspection_output/android-collected
      - name: Aggregate real screenshot integrity, source SHA, GLES and repair findings
        run: |
          set -euo pipefail
          python3 veilforge/android_review.py \
            --root inspection_output/android-collected \
            --out inspection_output/android-review \
            --source-sha "${{ github.sha }}" \
            --apk-sha "${{ needs.build-android-visual-probe.outputs.sha256 }}"
          cat inspection_output/android-review/android_gate_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish auditable screenshots summary and scoped repair queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-android-final-review
          path: inspection_output/android-review/
          if-no-files-found: warn
          retention-days: 7

  extended-visual-review:
    name: Independently verify mobile LOD and per-asset Android silhouettes
    needs: [android-visual-review, android-visual-workers]
    if: always() && needs.android-visual-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shared image-analysis dependency once
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Download identical emulator capture set once for both independent reviewers
        uses: actions/download-artifact@v4
        with:
          pattern: veilforge-android-{scene-world,nature-mobile,props-equipment,characters}
          path: inspection_output/android-collected
      - name: Run both independent visual checks even when one fails
        shell: bash
        run: |
          set +e
          python3 veilforge/visual_lod.py \
            --root inspection_output/android-collected \
            --out inspection_output/android-lod
          LOD_RESULT=$?
          python3 veilforge/visual_semantics.py \
            --root inspection_output/android-collected \
            --out inspection_output/semantic-review
          SEMANTIC_RESULT=$?
          set -e
          if [ -f inspection_output/android-lod/visual_lod_report.md ]; then
            cat inspection_output/android-lod/visual_lod_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f inspection_output/semantic-review/semantic_visual_review.md ]; then
            cat inspection_output/semantic-review/semantic_visual_review.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "LOD reviewer exit: $LOD_RESULT; semantic reviewer exit: $SEMANTIC_RESULT"
          test "$LOD_RESULT" -eq 0
          test "$SEMANTIC_RESULT" -eq 0
      - name: Convert every verified semantic warning into scoped next-iteration tasks
        if: always()
        run: |
          set -euo pipefail
          python3 veilforge/vq_android_repair_handoff.py \
            --semantic inspection_output/semantic-review/semantic_visual_review.json \
            --out inspection_output/next-iteration-review \
            --source-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"
          cat inspection_output/next-iteration-review/next_iteration_tasks.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive machine-readable repair tasks for the next VQ worker iteration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-android-next-iteration-tasks
          path: inspection_output/next-iteration-review/
          if-no-files-found: warn
          retention-days: 21
      - name: Preserve the full original independent LOD evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-android-visual-lod-review
          path: inspection_output/android-lod/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the full original semantic repair evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilforge-android-semantic-review
          path: inspection_output/semantic-review/
          if-no-files-found: warn
          retention-days: 7

  bounded-auto-model-candidates:
    name: Produce isolated candidate geometry from verified emulator findings
    needs: [library-review, asset-producers, extended-visual-review]
    if: always() && needs.library-review.result == 'success' && needs.extended-visual-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the source renderer dependency once
        run: python3 -m pip install --quiet pillow==11.3.0
      - name: Download validated next-iteration visual tasks
        uses: actions/download-artifact@v4
        with:
          name: veilforge-android-next-iteration-tasks
          path: inspection_output/candidate-feedback
      - name: Download only the verified source OBJ and manifest for the allowlisted sword
        uses: actions/download-artifact@v4
        with:
          name: veilforge-library-ceremonial_sword
          path: inspection_output/candidate-source
      - name: Generate bounded copy-on-write model candidate and all 14 before/after source angles
        run: |
          set -euo pipefail
          python3 veilforge/vq_auto_model_rewriter.py \
            --tasks inspection_output/candidate-feedback/next_iteration_tasks.json \
            --source-dir inspection_output/candidate-source \
            --out inspection_output/auto-model-candidates \
            --source-sha "${{ github.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("inspection_output/auto-model-candidates/auto_rewrite_candidates.json")
          data=json.loads(p.read_text())
          assert data["source_commit"]=="${{ github.sha }}"
          assert data["auto_promotion"] is False
          assert data["android_candidate_visual_qa_passed"] is False
          assert data["artistic_acceptance"] is False
          assert len(data["candidates"])<=1
          if data["candidates"]:
              row=data["candidates"][0]
              assert row["source_file_modified"] is False
              assert row["original_14_views"]==row["candidate_14_views"]==14
              assert (p.parent/"ceremonial_sword_candidate.obj").is_file()
          print("VEILFORGE_BOUNDED_REWRITE_CANDIDATES",len(data["candidates"]),
                "from",data["tickets_received"],"real emulator findings")
          PY
      - name: Preserve all candidate mesh, source views and provenance for independent review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veilforge-unapproved-auto-model-candidates
          path: inspection_output/auto-model-candidates/
          if-no-files-found: warn
          retention-days: 21

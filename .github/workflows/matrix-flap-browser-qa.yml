name: Matrix Flap Cinematic Visual QA
on:
  push:
    branches:
      - qa/matrix-flap-v12-browser
      - feature/matrix-flap-cinematic-v12
    paths:
      - 'matrix-flap/**'
      - '.github/workflows/matrix-flap-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrix-flap-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cinematic-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Chromium visual-testing environment
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Compare layouts and controls across phone sizes
        run: python3 matrix-flap/scripts/browser_visual_qa.py
      - name: Upload menu, gameplay, settings and pause captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-flap-cinematic-responsive-visual-qa
          path: inspection_output/matrix_flap/browser_qa/
          if-no-files-found: warn

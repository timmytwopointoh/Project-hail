name: VQ ecosystem contract — lightweight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vq-ecosystem-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline policy and cross-repo role checks (no Android or uploads)
        run: python3 tools/verify_vq_ecosystem.py
